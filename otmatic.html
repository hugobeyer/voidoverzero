    <script>
        // Mark active product bar link
        (function() {
            const currentPage = window.location.pathname.split('/').pop() || 'otmatic.html';
            const links = document.querySelectorAll('.product-bar-link');
            links.forEach(link => {
                const href = link.getAttribute('href');
                if (href && (href === currentPage || href.includes(currentPage))) {
                    link.classList.add('active');
                }
            });
        })();
